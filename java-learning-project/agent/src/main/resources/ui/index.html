<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingress reports</title>
  <style>
    body {
      margin: 0;
      background: #f6f6f4;
      color: #1b1b1b;
      font-family: sans-serif;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    aside { border-right: 1px solid #ccc; padding: 16px; }
    main { padding: 16px 24px; }
    button, input {
      background: #fff;
      color: #1b1b1b;
      border: 1px solid #b5b5b5;
      padding: 6px 8px;
    }
    button.report { display: block; width: 100%; text-align: left; margin: 0 0 8px; }
    .numbers { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0; }
    pre { white-space: pre-wrap; background: #fff; padding: 12px; }
    .turn { margin: 8px 0; }
    .turn strong { display: block; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
    input { flex: 1; }
    #error { color: #8a1f1f; }
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Reports</h1>
    <div id="list"></div>
  </aside>
  <main>
    <p id="empty">Open a report to read it.</p>
    <section id="open" hidden>
      <div id="numbers" class="numbers"></div>
      <h2>Report</h2>
      <pre id="body"></pre>
      <h2>Follow-up</h2>
      <div id="transcript"></div>
      <form id="ask">
        <label for="question">Question</label>
        <input id="question" name="question" maxlength="4000" required>
        <button type="submit">Ask</button>
      </form>
      <p id="error"></p>
    </section>
  </main>
  <script>
    const list = document.querySelector("#list");
    const openPanel = document.querySelector("#open");
    const empty = document.querySelector("#empty");
    let currentId = null;

    function text(parent, tag, value) {
      const el = document.createElement(tag);
      el.textContent = value;
      parent.appendChild(el);
      return el;
    }

    async function loadList() {
      const reports = await (await fetch("/api/reports")).json();
      list.replaceChildren();
      if (reports.length === 0) {
        text(list, "p", "No reports yet.");
        return;
      }
      for (const report of reports) {
        const item = document.createElement("div");
        const preview = document.createElement("p");
        preview.textContent = report.preview;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "report";
        button.dataset.id = report.id;
        button.textContent = "Open report";
        item.append(preview, button);
        list.appendChild(item);
      }
    }

    // One listener on the list, so a click on the preview text still opens the report.
    list.addEventListener("click", (event) => {
      const button = event.target.closest("button.report");
      if (!button) {
        return;
      }
      loadReport(button.dataset.id);
    });

    function showNumbers(snapshot) {
      const box = document.querySelector("#numbers");
      box.replaceChildren();
      const rows = [
        ["Queue depth", snapshot.queueDepth],
        ["Attempts", snapshot.attempts],
        ["Failures", snapshot.failures],
        ["Dropped", snapshot.dropped],
        ["Mean seconds", snapshot.meanSeconds]
      ];
      for (const [label, value] of rows) {
        text(box, "span", label);
        text(box, "strong", String(value));
      }
      const codes = snapshot.errorsByCode || {};
      const names = Object.keys(codes);
      text(box, "span", "Errors by status");
      text(box, "strong", names.length === 0 ? "none" : names.map(name => name + " " + codes[name]).join(", "));
    }

    function addTurn(role, content) {
      const line = document.createElement("p");
      line.className = "turn";
      const who = document.createElement("strong");
      who.textContent = role === "user" ? "You" : "Report";
      const said = document.createElement("span");
      said.textContent = " " + content;
      line.append(who, said);
      document.querySelector("#transcript").appendChild(line);
    }

    async function loadReport(id) {
      const response = await fetch("/api/reports/" + encodeURIComponent(id));
      if (!response.ok) {
        return;
      }
      const report = await response.json();
      currentId = id;
      empty.hidden = true;
      openPanel.hidden = false;
      showNumbers(JSON.parse(report.snapshotJson));
      document.querySelector("#body").textContent = report.body;
      document.querySelector("#transcript").replaceChildren();
      // The first assistant message is the body already shown above.
      for (const message of report.messages.slice(1)) {
        addTurn(message.role, message.content);
      }
    }

    document.querySelector("#ask").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.querySelector("#question");
      const error = document.querySelector("#error");
      error.textContent = "";
      const response = await fetch("/api/reports/" + encodeURIComponent(currentId) + "/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: input.value })
      });
      if (!response.ok) {
        error.textContent = response.status === 400 ? "That question is empty or too long." : "That report is gone.";
        return;
      }
      const answer = await response.json();
      addTurn("user", input.value);
      addTurn("assistant", answer.content);
      input.value = "";
    });

    loadList();
  </script>
</body>
</html>
