# Ingress agent settings. No secrets here, so this file is committed.
# Run the agent from java-learning-project so these relative paths resolve.
#
# Any key can be overridden by an environment variable. Upper-case the key
# and turn dots into underscores: agent.model.name -> AGENT_MODEL_NAME.
#
# Keys are environment only, never this file:
#   GEMINI_API_KEY (or GEMINI_AI_KEY)   used only when agent.gcp.project is empty
#   LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY   blank -> no traces
# config/agent.env (gitignored) is a handy place to keep them.

# Loopback only. The edge posts crossings to 127.0.0.1:8095/api/incidents.
agent.http.port=8095

# SQLite file. The folder is created on first start. data/ is gitignored.
agent.db.path=data/ingress-reports.db

# Empty means Google's AI Studio endpoint (generativelanguage.googleapis.com/v1beta).
# Set it only to point at a proxy or a local stub. The platform client ignores it.
agent.model.base.url=
agent.model.name=gemini-3.6-flash
agent.model.timeout.seconds=30

# Gemini platform (aiplatform.googleapis.com). A project here wins over GEMINI_API_KEY.
# Auth is Application Default Credentials: gcloud auth application-default login.
# Leave the project empty to stay on the AI Studio key.
agent.gcp.project=gen-lang-client-0176345518
# gemini-3.6-flash is served from the global endpoint, not a regional one.
agent.gcp.location=global
